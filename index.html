<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smile Spin">
<meta name="theme-color" content="#140b2e">
<title>Smile Spin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#140b2e; --bg2:#3a1466; --accent:#ffd23f; --text:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  body {
    font-family:'Fredoka',system-ui,sans-serif; color:var(--text);
    background:radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1) 70%);
    transition:background .6s;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { text-align:center; margin-top:14px; }
  h1 { margin:0; font-size:30px; letter-spacing:1px; color:var(--accent); text-shadow:0 3px 0 rgba(0,0,0,.35); }
  #mood { font-size:15px; opacity:.85; min-height:20px; margin-top:2px; }
  .stats { display:flex; gap:10px; margin:12px 0 4px; }
  .stat { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:6px 12px; text-align:center; min-width:78px; }
  .stat b { display:block; font-size:22px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .stat span { font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:.7; }
  #levelbar { width:min(320px,80vw); height:10px; background:rgba(255,255,255,.1); border-radius:10px; overflow:hidden; margin-top:6px; }
  #levelfill { height:100%; width:0; background:linear-gradient(90deg,var(--accent),#ff5fa2); transition:width .2s; }
  #levelLabel { font-size:12px; opacity:.75; margin-top:4px; }
  #stage { flex:1; width:100%; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #hint { position:absolute; bottom:10px; width:100%; text-align:center; font-size:15px; opacity:.8; pointer-events:none; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  #toast { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(.5); font-size:38px; font-weight:700; color:var(--accent);
    text-shadow:0 4px 0 rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:all .35s cubic-bezier(.2,1.6,.4,1); white-space:nowrap; }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  nav { display:flex; gap:8px; margin:6px 0 16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  nav button, .mbtn { font-family:inherit; font-size:16px; color:#fff; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    border-radius:999px; padding:10px 14px; cursor:pointer; }
  nav button.icon { padding:10px 12px; font-size:18px; }
  nav button.primary, .mbtn.primary { background:var(--accent); color:#2a1400; border-color:transparent; font-weight:700; }
  nav button:active, .mbtn:active { transform:scale(.94); }
  nav button:disabled { opacity:.4; }

  /* challenge HUD */
  #hud { position:absolute; top:8px; left:50%; transform:translateX(-50%); display:none; text-align:center; pointer-events:none;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:6px 18px; }
  #hud.on { display:block; }
  #hudTime { font-size:30px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1.1; }
  #hudSpins { font-size:15px; opacity:.9; }
  #hud.hurry #hudTime { color:#ff5d73; animation:pulse .5s infinite; }
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:110px; font-weight:700;
    color:var(--accent); text-shadow:0 6px 0 rgba(0,0,0,.4); pointer-events:none; }
  #countdown.on { display:flex; }

  /* modal */
  #modal { position:fixed; inset:0; background:rgba(5,0,15,.72); display:none; align-items:center; justify-content:center; z-index:10;
    padding:16px; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  #modal.on { display:flex; }
  .card { width:min(380px,100%); max-height:calc(100% - 20px); overflow:auto; background:linear-gradient(160deg,var(--bg2),var(--bg1));
    border:1px solid rgba(255,255,255,.18); border-radius:22px; padding:20px 18px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .card h2 { margin:0 0 4px; color:var(--accent); font-size:26px; }
  .card .big { font-size:64px; font-weight:700; color:var(--accent); line-height:1; margin:8px 0 2px; }
  .card p { margin:6px 0; opacity:.9; }
  .card .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .card input { font-family:inherit; font-size:18px; width:100%; padding:10px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.3); color:#fff; text-align:center; margin-top:10px; user-select:text; -webkit-user-select:text; }
  .card .err { color:#ff8fa0; font-size:14px; min-height:18px; margin-top:6px; }
  .tabs { display:flex; gap:6px; justify-content:center; margin:10px 0; }
  .tabs button { font-family:inherit; font-size:14px; color:#fff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    border-radius:999px; padding:6px 14px; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#2a1400; border-color:transparent; font-weight:700; }
  ol.board { list-style:none; margin:0; padding:0; text-align:left; }
  ol.board li { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; }
  ol.board li:nth-child(odd) { background:rgba(255,255,255,.05); }
  ol.board li.me { background:rgba(255,210,63,.22); outline:1px solid var(--accent); }
  ol.board .rk { width:30px; text-align:center; font-weight:700; opacity:.85; }
  ol.board .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ol.board .sc { font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .muted { opacity:.65; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>😊 Smile Spin</h1>
  <div id="mood">Flick me! I'm sleepy…</div>
</header>
<div class="stats">
  <div class="stat"><b id="rpm">0</b><span>RPM</span></div>
  <div class="stat"><b id="spins">0</b><span>Spins</span></div>
  <div class="stat"><b id="best">0</b><span>Best RPM</span></div>
</div>
<div id="levelbar"><div id="levelfill"></div></div>
<div id="levelLabel">Level 1</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="toast"></div>
  <div id="hud"><div id="hudTime">30.0</div><div id="hudSpins">0 spins</div></div>
  <div id="countdown"></div>
  <div id="hint">👆 Swipe around the spinner • tap the middle to boost</div>
</div>
<nav>
  <button id="challengeBtn" class="primary">🏁 30s Challenge</button>
  <button id="boardBtn">🏆 Top</button>
  <button id="themeBtn" class="icon" aria-label="Change color">🎨</button>
  <button id="soundBtn" class="icon" aria-label="Sound on/off">🔊</button>
  <button id="hapticBtn" class="icon" aria-label="Buzz on/off">📳</button>
</nav>
<div id="modal"><div class="card" id="card"></div></div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const themes = [
    { name:'Grape',  bg1:'#140b2e', bg2:'#3a1466', a:'#ff5fa2', b:'#7b2ff7', accent:'#ffd23f' },
    { name:'Ocean',  bg1:'#04172b', bg2:'#0b4f7a', a:'#00e5ff', b:'#2962ff', accent:'#7cffcb' },
    { name:'Lava',   bg1:'#1f0500', bg2:'#6b1a00', a:'#ffb300', b:'#ff3d00', accent:'#fff176' },
    { name:'Lime',   bg1:'#071a0a', bg2:'#1d5a22', a:'#c6ff00', b:'#00c853', accent:'#ffffff' },
    { name:'Candy',  bg1:'#2a0b25', bg2:'#7a1e6a', a:'#ff80ab', b:'#ea80fc', accent:'#b9f6ff' },
  ];

  // ---------- storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('smilespin_'+k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } },
    set(k, v) { try { localStorage.setItem('smilespin_'+k, JSON.stringify(v)); } catch(e) {} }
  };

  let themeIdx = store.get('theme', 0) % themes.length;
  let soundOn = store.get('sound', true);
  let hapticOn = store.get('haptic', true);
  let totalRot = store.get('rot', 0);       // total radians spun, all time
  let bestRpm = store.get('best', 0);

  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const stage = $('stage');

  // ---------- sizing ----------
  let W, H, cx, cy, S, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2;
    S = Math.min(W, H) * 0.46;  // overall spinner radius
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- theme ----------
  function applyTheme() {
    const t = themes[themeIdx];
    const r = document.documentElement.style;
    r.setProperty('--bg1', t.bg1); r.setProperty('--bg2', t.bg2); r.setProperty('--accent', t.accent);
  }
  applyTheme();

  // ---------- audio ----------
  let actx = null;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    if (actx && actx.state === 'suspended') actx.resume().catch(()=>{});
    return actx;
  }
  function tick(speed) {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.value = 500 + Math.min(speed, 60) * 18 + Math.random() * 40;
    g.gain.setValueAtTime(0.06, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.05);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.06);
  }
  function chime() {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    [523, 659, 784, 1046].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = a.currentTime + i * 0.08;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + 0.4);
    });
  }
  function buzz(ms) { if (hapticOn && navigator.vibrate) { try { navigator.vibrate(ms); } catch(e) {} } }

  // ---------- physics ----------
  let rot = 0, vel = 0;           // radians, rad/s
  const MAX_V = 90;
  let dragging = false, lastAng = 0, lastT = 0, dragVel = 0;
  let lastLobe = 0, lastTickT = 0, lastBuzzT = 0;
  let boostPulse = 0;
  // challenge state
  const CH_SECONDS = 30;
  const ch = { active:false, locked:false, rot:0, endAt:0 };

  function angAt(x, y) { return Math.atan2(y - cy, x - cx); }
  function norm(d) { while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
  function local(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  function addRot(d) { totalRot += d; if (ch.active) ch.rot += d; }

  canvas.addEventListener('pointerdown', e => {
    audio();
    if (ch.locked) return;                // countdown in progress
    $('hint').style.display = 'none';
    const p = local(e);
    const dist = Math.hypot(p.x - cx, p.y - cy);
    if (dist < S * 0.22) { // tap hub = boost
      const dir = vel >= 0 ? 1 : -1;
      vel = Math.max(-MAX_V, Math.min(MAX_V, vel + dir * 12));
      boostPulse = 1; buzz(15);
      return;
    }
    canvas.setPointerCapture(e.pointerId);
    dragging = true; lastAng = angAt(p.x, p.y); lastT = performance.now(); dragVel = vel;
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const p = local(e), now = performance.now();
    const a = angAt(p.x, p.y), d = norm(a - lastAng);
    const dt = Math.max((now - lastT) / 1000, 0.001);
    rot += d; addRot(Math.abs(d));
    const inst = d / dt;
    dragVel = dragVel * 0.6 + inst * 0.4;
    vel = dragVel;
    lastAng = a; lastT = now;
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (performance.now() - lastT > 120) dragVel *= 0.3; // held still before release
    vel = Math.max(-MAX_V, Math.min(MAX_V, dragVel * 1.15));
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  // ---------- buttons ----------
  function updateBtns() {
    $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    $('hapticBtn').textContent = hapticOn ? '📳' : '📴';
  }
  updateBtns();
  $('themeBtn').onclick = () => { themeIdx = (themeIdx + 1) % themes.length; store.set('theme', themeIdx); applyTheme(); showToast(themes[themeIdx].name + '!'); };
  $('soundBtn').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateBtns(); if (soundOn) tick(5); };
  $('hapticBtn').onclick = () => { hapticOn = !hapticOn; store.set('haptic', hapticOn); updateBtns(); buzz(30); };

  // ---------- toast + confetti ----------
  let toastTimer;
  function showToast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
  }
  const confetti = [];
  function burst(n) {
    const t = themes[themeIdx], cols = [t.a, t.b, t.accent, '#fff'];
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * TAU, sp = 200 + Math.random() * 500;
      confetti.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 200,
        r: 4 + Math.random() * 5, c: cols[i % cols.length], life: 1.6 + Math.random(), spin: Math.random() * TAU, vs: (Math.random() - .5) * 12 });
    }
  }

  // ---------- leaderboard (Firebase Firestore REST, free Spark plan) ----------
  const FB_KEY = 'AIzaSyD5rv__dCyewPDWDvekIAfoYW-SK6WAd4s';           // public web key (safe to ship; access is limited by Firestore rules)
  const FB_DOCS = 'projects/smile-spin/databases/(default)/documents';
  const FB_BASE = 'https://firestore.googleapis.com/v1/' + FB_DOCS;
  const GAME_URL = 'https://zerocool0007.github.io/smile-spin/';

  function isoWeek(d = new Date()) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    const y = t.getUTCFullYear();
    const w = Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7);
    return y + '-W' + String(w).padStart(2, '0');
  }
  function randId(n = 20) {
    const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let s = ''; const a = new Uint32Array(n);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 1e9);
    for (let i = 0; i < n; i++) s += c[a[i] % c.length];
    return s;
  }
  async function postScore(name, score) {
    const id = randId();
    const body = { writes: [{
      update: { name: FB_DOCS + '/scores/' + id, fields: {
        name: { stringValue: name }, score: { integerValue: String(score) }, week: { stringValue: isoWeek() } } },
      updateTransforms: [{ fieldPath: 'ts', setToServerValue: 'REQUEST_TIME' }],
      currentDocument: { exists: false }
    }]};
    const r = await fetch(FB_BASE + ':commit?key=' + FB_KEY, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('post failed ' + r.status);
    return id;
  }
  async function runQuery(sq) {
    const r = await fetch(FB_BASE + ':runQuery?key=' + FB_KEY, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ structuredQuery: sq }) });
    if (!r.ok) throw new Error('query failed ' + r.status);
    const j = await r.json();
    return j.filter(x => x.document).map(x => ({
      id: x.document.name.split('/').pop(),
      name: x.document.fields.name.stringValue,
      score: Number(x.document.fields.score.integerValue)
    }));
  }
  // best score per name (so one person can't fill the whole board)
  function bestPerName(rows) {
    const m = new Map();
    for (const r of rows) { const k = r.name.trim().toLowerCase(); if (!m.has(k) || m.get(k).score < r.score) m.set(k, r); }
    return [...m.values()].sort((a, b) => b.score - a.score).slice(0, 20);
  }
  async function loadBoard(kind) {
    if (kind === 'week') {
      const rows = await runQuery({ from:[{ collectionId:'scores' }],
        where:{ fieldFilter:{ field:{ fieldPath:'week' }, op:'EQUAL', value:{ stringValue: isoWeek() } } }, limit: 500 });
      return bestPerName(rows);
    }
    const rows = await runQuery({ from:[{ collectionId:'scores' }],
      orderBy:[{ field:{ fieldPath:'score' }, direction:'DESCENDING' }], limit: 150 });
    return bestPerName(rows);
  }

  // simple name filter (kids play this)
  const BAD = ['fuck','fuk','shit','bitch','cunt','dick','cock','pussy','penis','vagina','sex','porn','nigg','nigga','fag','slut','whore','rape','nazi','hitler','kkk','retard','ass','asshole','damn','piss','boob','tits','cum','anal','kill','die'];
  function cleanName(raw) {
    const n = (raw || '').replace(/[^A-Za-z0-9 _.-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12);
    if (n.length < 2) return { ok:false, msg:'Use 2–12 letters or numbers.' };
    const flat = n.toLowerCase().replace(/[0]/g,'o').replace(/[1!]/g,'i').replace(/[3]/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/[7]/g,'t').replace(/[^a-z]/g,'');
    if (BAD.some(w => flat.includes(w))) return { ok:false, msg:'Please pick a friendlier name 🙂' };
    return { ok:true, name:n };
  }

  // ---------- modal ----------
  const modal = $('modal'), card = $('card');
  function openModal(html) { card.innerHTML = html; modal.classList.add('on'); }
  function closeModal() { modal.classList.remove('on'); }
  modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  let boardKind = 'week';
  async function showBoard(highlightId, myScore) {
    openModal(`<h2>🏆 Leaderboard</h2>
      <p class="muted">Most spins in 30 seconds</p>
      <div class="tabs"><button data-k="week" class="${boardKind==='week'?'on':''}">This week</button><button data-k="all" class="${boardKind==='all'?'on':''}">All time</button></div>
      <div id="boardBody"><p class="muted">Loading…</p></div>
      <div class="row"><button class="mbtn primary" id="bPlay">🏁 Play</button><button class="mbtn" id="bClose">Close</button></div>`);
    card.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { boardKind = b.dataset.k; showBoard(highlightId, myScore); });
    $('bPlay').onclick = () => { closeModal(); startChallenge(); };
    $('bClose').onclick = closeModal;
    try {
      const rows = await loadBoard(boardKind);
      const body = $('boardBody'); if (!body) return;
      if (!rows.length) { body.innerHTML = '<p class="muted">No scores yet — be the first! 🥇</p>'; return; }
      const medal = i => ['🥇','🥈','🥉'][i] || (i + 1);
      body.innerHTML = '<ol class="board">' + rows.map((r, i) =>
        `<li class="${r.id === highlightId ? 'me' : ''}"><span class="rk">${medal(i)}</span><span class="nm">${esc(r.name)}</span><span class="sc">${r.score}</span></li>`).join('') + '</ol>'
        + (highlightId && !rows.some(r => r.id === highlightId) && myScore ? `<p class="muted">Your score: ${myScore} — keep spinning to crack the top 20!</p>` : '');
    } catch (err) {
      const body = $('boardBody'); if (body) body.innerHTML = '<p class="err">Couldn\'t load the leaderboard. Check your internet and try again.</p>';
    }
  }

  // ---------- 30 second challenge ----------
  let bestChallenge = store.get('bestCh', 0);
  let nickname = store.get('nick', '');
  const countdownEl = $('countdown'), hud = $('hud');

  function startChallenge() {
    if (ch.active || ch.locked) return;
    closeModal(); audio();
    $('hint').style.display = 'none';
    vel = 0; dragging = false;
    ch.locked = true; ch.rot = 0;
    $('challengeBtn').disabled = true;
    const steps = ['3', '2', '1', 'GO!'];
    let i = 0;
    const next = () => {
      countdownEl.textContent = steps[i]; countdownEl.classList.add('on');
      if (soundOn) { const a = audio(); if (a) { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = i < 3 ? 660 : 990;
        g.gain.setValueAtTime(0.12, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.25);
        o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.3); } }
      buzz(i < 3 ? 20 : 60);
      i++;
      if (i < steps.length) setTimeout(next, 750);
      else setTimeout(() => {
        countdownEl.classList.remove('on');
        ch.locked = false; ch.active = true; ch.rot = 0;
        ch.endAt = performance.now() + CH_SECONDS * 1000;
        hud.classList.add('on'); hud.classList.remove('hurry');
      }, 450);
    };
    next();
  }

  function challengeTick(now) {
    if (!ch.active) return;
    const left = Math.max(0, (ch.endAt - now) / 1000);
    $('hudTime').textContent = left.toFixed(1);
    $('hudSpins').textContent = Math.floor(ch.rot / TAU) + ' spins';
    hud.classList.toggle('hurry', left <= 5);
    if (left <= 0) endChallenge();
  }

  function endChallenge() {
    ch.active = false;
    hud.classList.remove('on', 'hurry');
    $('challengeBtn').disabled = false;
    const score = Math.min(450, Math.floor(ch.rot / TAU));
    const newBest = score > bestChallenge;
    if (newBest) { bestChallenge = score; store.set('bestCh', score); }
    chime(); burst(newBest ? 140 : 60); buzz([40, 50, 80]);
    setTimeout(() => showResult(score, newBest), 500);
  }

  function shareText(score) {
    return `I spun Smile Spin ${score} times in 30 seconds 😵‍💫 Can you beat me? ${GAME_URL}`;
  }
  async function share(score, btn) {
    const text = shareText(score);
    try {
      if (navigator.share) { await navigator.share({ title:'Smile Spin', text }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); btn.textContent = '✅ Copied!'; }
    catch (e) { btn.textContent = 'Copy failed'; }
  }

  function showResult(score) {
    openModal(`<h2>Time's up!</h2>
      <div class="big">${score}</div>
      <p>spins in 30 seconds</p>
      <p class="muted">${score >= bestChallenge && score > 0 ? '🎉 New personal best!' : 'Your best: ' + bestChallenge}</p>
      ${score > 0 ? `<input id="nick" maxlength="12" placeholder="Your nickname" value="${esc(nickname)}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="err" id="nickErr"></div>
      <div class="row"><button class="mbtn primary" id="rPost">🏆 Post score</button><button class="mbtn" id="rShare">📤 Challenge a friend</button></div>` : ''}
      <div class="row"><button class="mbtn" id="rAgain">🔁 Play again</button><button class="mbtn" id="rClose">Close</button></div>
      <p class="muted" style="margin-top:10px">Nicknames only — don't use your real name.</p>`);
    $('rAgain').onclick = () => { closeModal(); startChallenge(); };
    $('rClose').onclick = closeModal;
    if (score <= 0) return;
    $('rShare').onclick = () => share(score, $('rShare'));
    $('rPost').onclick = async () => {
      const c = cleanName($('nick').value);
      if (!c.ok) { $('nickErr').textContent = c.msg; return; }
      nickname = c.name; store.set('nick', nickname);
      const btn = $('rPost'); btn.disabled = true; btn.textContent = 'Posting…';
      try {
        const id = await postScore(nickname, score);
        showBoard(id, score);
      } catch (e) {
        btn.disabled = false; btn.textContent = '🏆 Post score';
        $('nickErr').textContent = "Couldn't post — check your internet and try again.";
      }
    };
  }

  $('challengeBtn').onclick = startChallenge;
  $('boardBtn').onclick = () => showBoard();

  // ---------- levels ----------
  const SPINS_PER_LEVEL = 50;
  let level = Math.floor(totalRot / TAU / SPINS_PER_LEVEL) + 1;
  const levelMsgs = ['Nice!', 'Spin Master!', 'Whoa!!', 'Unstoppable!', 'Legendary!', 'Smile Overload!', 'Cosmic!'];

  // ---------- drawing helpers ----------
  function face(x, y, r, mood, t, rotation = 0) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
    // head
    const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
    g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#ffc107');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    ctx.lineWidth = r * 0.06; ctx.strokeStyle = 'rgba(120,60,0,.35)'; ctx.stroke();
    ctx.fillStyle = '#3b2200'; ctx.strokeStyle = '#3b2200'; ctx.lineCap = 'round';
    const ex = r * 0.35, ey = -r * 0.18, er = r * 0.11;

    if (mood === 'dizzy') {
      ctx.lineWidth = r * 0.06;
      [-1, 1].forEach(s => {
        ctx.beginPath();
        for (let k = 0; k < 40; k++) {
          const a = k * 0.45 + t * 10 * s, rr = (k / 40) * er * 1.6;
          const px = s * ex + Math.cos(a) * rr, py = ey + Math.sin(a) * rr;
          k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
      });
      ctx.beginPath(); ctx.ellipse(0, r * 0.4, r * 0.18, r * 0.22, 0, 0, TAU); ctx.fill();
    } else if (mood === 'sleepy') {
      ctx.lineWidth = r * 0.07;
      [-1, 1].forEach(s => { ctx.beginPath(); ctx.arc(s * ex, ey, er, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); });
      ctx.beginPath(); ctx.arc(0, r * 0.2, r * 0.3, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
    } else {
      // eyes (blink occasionally)
      const blink = (Math.sin(t * 1.3) > 0.985) ? 0.15 : 1;
      const big = mood === 'wow' ? 1.35 : 1;
      [-1, 1].forEach(s => {
        ctx.beginPath(); ctx.ellipse(s * ex, ey, er * big, er * 1.3 * big * blink, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * ex + er * .35, ey - er * .45, er * .35 * big, 0, TAU); ctx.fill();
        ctx.fillStyle = '#3b2200';
      });
      if (mood === 'smile') {
        ctx.lineWidth = r * 0.08;
        ctx.beginPath(); ctx.arc(0, r * 0.1, r * 0.42, 0.18 * Math.PI, 0.82 * Math.PI); ctx.stroke();
      } else { // grin / wow: open mouth
        const open = mood === 'wow' ? 0.32 : 0.22;
        ctx.beginPath();
        ctx.moveTo(-r * 0.45, r * 0.18);
        ctx.quadraticCurveTo(0, r * (0.18 + open * 2.6), r * 0.45, r * 0.18);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff5d73';
        ctx.beginPath(); ctx.ellipse(0, r * (0.3 + open), r * 0.18, r * 0.08, 0, 0, TAU); ctx.fill();
      }
      // cheeks
      ctx.fillStyle = 'rgba(255,90,120,.35)';
      [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(s * r * 0.6, r * 0.12, r * 0.13, r * 0.08, 0, 0, TAU); ctx.fill(); });
    }
    ctx.restore();
  }

  function spinnerBody(rotation, alpha) {
    const t = themes[themeIdx];
    const R = S * 0.6, lr = S * 0.34;
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(rotation);
    const g = ctx.createLinearGradient(-S, -S, S, S);
    g.addColorStop(0, t.a); g.addColorStop(1, t.b);
    // arms
    ctx.strokeStyle = g; ctx.lineCap = 'round'; ctx.lineWidth = lr * 1.1;
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3 - Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); ctx.stroke();
    }
    // lobes
    ctx.fillStyle = g;
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3 - Math.PI / 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R, Math.sin(a) * R, lr, 0, TAU); ctx.fill();
    }
    // shine
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = S * 0.025;
    for (let i = 0; i < 3; i++) {
      const a = i * TAU / 3 - Math.PI / 2;
      ctx.beginPath(); ctx.arc(Math.cos(a) * R, Math.sin(a) * R, lr * 0.86, Math.PI * 1.05, Math.PI * 1.5); ctx.stroke();
    }
    ctx.restore();
    return { R, lr };
  }

  // ---------- loop ----------
  let prev = performance.now(), time = 0, shownRpm = 0;
  let saveTimer = 0;
  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.05); prev = now; time += dt;

    if (!dragging) {
      const before = rot;
      rot += vel * dt;
      addRot(Math.abs(rot - before));
      vel *= Math.exp(-0.28 * dt);            // smooth bearing friction
      const lin = 0.35 * dt;                   // tiny linear drag so it actually stops
      vel = Math.abs(vel) < lin ? 0 : vel - Math.sign(vel) * lin;
    }
    if (ch.locked) vel = 0;
    challengeTick(now);
    const speed = Math.abs(vel);
    const rpm = speed / TAU * 60;
    shownRpm += (rpm - shownRpm) * 0.15;

    // ticks when a lobe passes
    const lobe = Math.floor(rot / (TAU / 3));
    if (lobe !== lastLobe) {
      lastLobe = lobe;
      if (now - lastTickT > 28) { tick(speed); lastTickT = now; }
      if (now - lastBuzzT > 90 && speed > 2) { buzz(speed > 30 ? 4 : 8); lastBuzzT = now; }
    }

    // best + level
    if (rpm > bestRpm + 0.5 && rpm > 30) {
      const wasBest = bestRpm; bestRpm = rpm;
      if (wasBest > 30 && Math.floor(rpm / 100) > Math.floor(wasBest / 100)) { showToast('New record!'); chime(); burst(40); }
    }
    const spinsTotal = totalRot / TAU;
    const newLevel = Math.floor(spinsTotal / SPINS_PER_LEVEL) + 1;
    if (newLevel > level) {
      level = newLevel;
      showToast('Level ' + level + ' — ' + levelMsgs[(level - 2) % levelMsgs.length]);
      chime(); burst(120); buzz([30, 40, 60]);
    }

    // mood
    let mood, moodText;
    if (speed < 0.6) { mood = 'sleepy'; moodText = "Flick me! I'm sleepy…"; }
    else if (speed < 12) { mood = 'smile'; moodText = 'Hehe, that tickles 😊'; }
    else if (speed < 30) { mood = 'grin'; moodText = 'Wheee! Faster! 😁'; }
    else if (speed < 55) { mood = 'wow'; moodText = 'WOOOAH!! 🤩'; }
    else { mood = 'dizzy'; moodText = "I'm sooo dizzy 😵‍💫"; }
    $('mood').textContent = moodText;

    // draw
    ctx.clearRect(0, 0, W, H);
    const t = themes[themeIdx];

    // glow ring that grows with speed
    const glow = Math.min(speed / 60, 1);
    if (glow > 0.02) {
      const gg = ctx.createRadialGradient(cx, cy, S * 0.3, cx, cy, S * 1.25);
      gg.addColorStop(0, 'rgba(0,0,0,0)');
      gg.addColorStop(0.7, t.a + Math.round(glow * 90).toString(16).padStart(2, '0'));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, S * 1.25, 0, TAU); ctx.fill();
    }

    // motion-blur ghosts
    const ghosts = Math.min(5, Math.floor(speed / 8));
    for (let i = ghosts; i >= 1; i--) spinnerBody(rot - Math.sign(vel) * i * 0.06 * Math.min(speed / 20, 1.5), 0.12);
    const { R } = spinnerBody(rot, 1);

    // lobe faces (spin with the body, fade at high speed)
    const faceAlpha = Math.max(0.15, 1 - speed / 70);
    ctx.save(); ctx.globalAlpha = faceAlpha;
    for (let i = 0; i < 3; i++) {
      const a = rot + i * TAU / 3 - Math.PI / 2;
      face(cx + Math.cos(a) * R, cy + Math.sin(a) * R, S * 0.22, mood === 'dizzy' ? 'dizzy' : (speed < 0.6 ? 'sleepy' : 'grin'), time + i, a + Math.PI / 2);
    }
    ctx.restore();

    // hub (bearing — stays upright, the main face)
    boostPulse *= Math.exp(-6 * dt);
    const hubR = S * 0.24 * (1 + boostPulse * 0.15 + (mood === 'wow' ? Math.sin(time * 20) * 0.02 : 0));
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(cx, cy + 4, hubR * 1.08, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, hubR * 1.08, 0, TAU); ctx.fill();
    const wobble = mood === 'dizzy' ? Math.sin(time * 6) * 0.25 : 0;
    face(cx, cy, hubR, mood, time, wobble);

    // confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += 700 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.spin += p.vs * dt; p.life -= dt;
      if (p.life <= 0 || p.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    }

    // stats
    $('rpm').textContent = Math.round(shownRpm);
    $('spins').textContent = Math.floor(spinsTotal).toLocaleString();
    $('best').textContent = Math.round(bestRpm);
    const into = (spinsTotal % SPINS_PER_LEVEL) / SPINS_PER_LEVEL;
    $('levelfill').style.width = (into * 100) + '%';
    $('levelLabel').textContent = 'Level ' + level + ' • ' + Math.ceil(SPINS_PER_LEVEL - spinsTotal % SPINS_PER_LEVEL) + ' spins to next';

    saveTimer += dt;
    if (saveTimer > 2) { saveTimer = 0; store.set('rot', totalRot); store.set('best', bestRpm); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { store.set('rot', totalRot); store.set('best', bestRpm); });
})();
</script>
</body>
</html>
